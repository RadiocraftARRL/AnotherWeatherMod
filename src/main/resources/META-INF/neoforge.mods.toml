modLoader="javafml"
loaderVersion="${loader_version_range}"

license="MIT"
issueTrackerURL="https://github.com/itcmd/anotherweathermod/issues"

[[mods]]
    modId="anotherweathermod"
    version="${version}"
    displayName="Another Weather Mod"
    displayTest="IGNORE_SERVER_VERSION"
    authors="itcmd and the Another Weather Mod contributors"
    description='''Localized, moving, forecastable weather. Storm cells drift across the world, so it rains where the storm is and nowhere else. Hail, blizzards, sandstorms and hurricanes depend on the ground under the storm. Works on the server alone; an open API lets other mods read the weather and its forecast.'''

[[mixins]]
    config="anotherweathermod.mixins.json"

[[dependencies.anotherweathermod]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.anotherweathermod]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
